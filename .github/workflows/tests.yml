name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes rápidos (sem treinar Random Forest)
        run: pytest -m "not slow" -q
      - name: Pipeline em modo rápido (sem backtest) + testes de previsão
        run: |
          python -m src.pipeline --rapido
          pytest tests/test_predictions.py -q
